<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Formatter - API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
            text-align: center;
            font-size: 24px;
        }

        h2 {
            color: #667eea;
            font-size: 18px;
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 13px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .section-divider {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .preview-panel {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 25px;
            max-height: 600px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.8;
            color: #333;
        }

        .preview-panel pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            background: white;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .copy-btn {
            background: #4caf50;
            margin-top: 15px;
            font-size: 13px;
        }

        .copy-btn:hover {
            background: #45a049;
        }

        .success-msg {
            color: #4caf50;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .success-msg.show {
            opacity: 1;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }

            .input-row {
                grid-template-columns: 1fr;
            }
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #1565c0;
        }

        .error-msg {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 10px;
        }

        .link-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #856404;
        }

        .link-box a {
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
        }

        .link-box a:hover {
            text-decoration: underline;
        }

        .scrollbar-style::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar-style::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .scrollbar-style::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .scrollbar-style::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        .preview-panel {
            scrollbar-color: #667eea #f1f1f1;
            scrollbar-width: thin;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Panel: Input Form -->
        <div class="panel">
            <h1>📧 API Email Formatter</h1>

            <div class="info-box">
                💡 Max Card Payment Gateway - API Configuration
            </div>

            <div class="link-box">
                📎 <a href="maxpay-formatter.html">ไปที่ Max Pay Connect Formatter →</a>
            </div>

            <div id="formContainer">
                <div class="form-group">
                    <label>ชื่อบริษัท *</label>
                    <input type="text" id="apiCompanyName" placeholder="เช่น CP and K Thailand">
                </div>

                <h2>UAT</h2>
                <div class="section-divider">
                    <div class="input-row">
                        <div class="form-group">
                            <label>MID *</label>
                            <input type="text" id="midUat" placeholder="MID UAT">
                        </div>
                        <div class="form-group">
                            <label>Client ID *</label>
                            <input type="text" id="clientIdUat" placeholder="Client ID UAT">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Secret Key *</label>
                        <input type="text" id="secretKeyUat" placeholder="Secret Key UAT">
                    </div>
                    <div class="input-row">
                        <div class="form-group">
                            <label>User BU *</label>
                            <input type="text" id="userBuUat" placeholder="Username BU">
                        </div>
                        <div class="form-group">
                            <label>User Shop *</label>
                            <input type="text" id="userShopUat" placeholder="Username Shop">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>User Branch *</label>
                        <input type="text" id="userBranchUat" placeholder="Username Branch">
                    </div>
                </div>

                <h2>PROD</h2>
                <div class="section-divider">
                    <div class="input-row">
                        <div class="form-group">
                            <label>MID *</label>
                            <input type="text" id="midProd" placeholder="MID PROD">
                        </div>
                        <div class="form-group">
                            <label>Client ID *</label>
                            <input type="text" id="clientIdProd" placeholder="Client ID PROD">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Secret Key *</label>
                        <input type="text" id="secretKeyProd" placeholder="Secret Key PROD">
                    </div>
                    <div class="input-row">
                        <div class="form-group">
                            <label>User BU *</label>
                            <input type="text" id="userBuProd" placeholder="Username BU">
                        </div>
                        <div class="form-group">
                            <label>User Shop *</label>
                            <input type="text" id="userShopProd" placeholder="Username Shop">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>User Branch *</label>
                        <input type="text" id="userBranchProd" placeholder="Username Branch">
                    </div>
                </div>

                <button type="button" id="generateApiBtn">✨ สร้าง Email Format</button>
                <div class="error-msg" id="errorApiMsg" style="display: none;">⚠️ กรุณากรอกข้อมูลทั้งหมดที่มี * ค่ะ</div>
            </div>
        </div>

        <!-- Right Panel: Preview -->
        <div class="panel">
            <h1>👁️ Preview Email</h1>
            <div class="preview-panel scrollbar-style" id="preview">
                <p style="text-align: center; color: #999; padding: 40px 0;">กรอกข้อมูลและคลิก "สร้าง Email Format" เพื่อดูตัวอย่าง</p>
            </div>
            <button class="copy-btn" id="copyBtn" style="display: none;">📋 Copy Email Text</button>
            <div class="success-msg" id="successMsg">✓ คัดลอกสำเร็จ!</div>
        </div>
    </div>

    <script>
        let emailContent = '';

        // Validate API Form
        function validateApiForm() {
            const fields = [
                'apiCompanyName',
                'midUat', 'clientIdUat', 'secretKeyUat', 'userBuUat', 'userShopUat', 'userBranchUat',
                'midProd', 'clientIdProd', 'secretKeyProd', 'userBuProd', 'userShopProd', 'userBranchProd'
            ];

            for (let field of fields) {
                if (!document.getElementById(field).value.trim()) {
                    return false;
                }
            }
            return true;
        }

        // Generate API Email
        function generateApiEmail() {
            const companyName = document.getElementById('apiCompanyName').value;
            const midUat = document.getElementById('midUat').value;
            const clientIdUat = document.getElementById('clientIdUat').value;
            const secretKeyUat = document.getElementById('secretKeyUat').value;
            const userBuUat = document.getElementById('userBuUat').value;
            const userShopUat = document.getElementById('userShopUat').value;
            const userBranchUat = document.getElementById('userBranchUat').value;

            const midProd = document.getElementById('midProd').value;
            const clientIdProd = document.getElementById('clientIdProd').value;
            const secretKeyProd = document.getElementById('secretKeyProd').value;
            const userBuProd = document.getElementById('userBuProd').value;
            const userShopProd = document.getElementById('userShopProd').value;
            const userBranchProd = document.getElementById('userBranchProd').value;

            emailContent = `เรียน ทุกท่านค่ะ
         นำส่งข้อมูลสำหรับการเชื่อมต่อ Max Card Payment Gateway ของ ${companyName} ทั้ง Environment UAT และ PRD ดังนี้ค่ะ

1. Environment UAT
1.1 ข้อมูลการเชื่อมต่อ
MID : ${midUat}
Client ID : ${clientIdUat}
Secret Key : ${secretKeyUat}

1.2 ข้อมูลสำหรับเข้าดูรายงาน
(กรณีต้องการเข้าดูรายงานสามารเข้าใช้งานด้วยข้อมูลด้านล่าง และหากต้องการสร้าง Payment Link จะต้องเข้าสู่ระบบด้วยข้อมูลของสาขา)

ผู้ใช้งาน ระดับ BU
username : ${userBuUat}
password : Bk5E!M}GGV,c>vJ5=0+J

ผู้ใช้งาน ระดับ Shop
username : ${userShopUat}
password : Bk5E!M}GGV,c>vJ5=0+J

ผู้ใช้งาน ระดับ Branch
username : ${userBranchUat}
password : Bk5E!M}GGV,c>vJ5=0+J

ข้อมูลสาขา ณ ปัจจุบัน มีดังนี้
1. สาขา ${companyName}

สามารถเข้าใช้งานได้ที่ลิงก์
https://merchant-uat.maxcardpay.com/
URL ที่เรียกใช้สามารถตรวจสอบได้ที่ Spec API ค่ะ

2. Environment PRD
2.1 ข้อมูลการเชื่อมต่อ
MID :  ${midProd}
Client ID : ${clientIdProd}
Secret Key : ${secretKeyProd}

2.2 ข้อมูลสำหรับเข้าดูรายงาน
(กรณีต้องการเข้าดูรายงานสามารเข้าใช้งานด้วยข้อมูลด้านล่าง และหากต้องการสร้าง Payment Link จะต้องเข้าสู่ระบบด้วยข้อมูลของสาขา)

ผู้ใช้งาน ระดับ BU
username : ${userBuProd}
password : Bk5E!M}GGV,c>vJ5=0+J

ผู้ใช้งาน ระดับ Shop
username : ${userShopProd}
password : Bk5E!M}GGV,c>vJ5=0+J

ผู้ใช้งาน ระดับ Branch
username : ${userBranchProd}
password : Bk5E!M}GGV,c>vJ5=0+J

ข้อมูลสาขา ณ ปัจจุบัน มีดังนี้
1. สาขา ${companyName}
สามารถเข้าใช้งานได้ที่ลิงก์
https://merchant.maxcardpay.com/
URL ที่เรียกใช้สามารถตรวจสอบได้ที่ Spec API ค่ะ


(หากต้องการให้ระบบส่ง API Callback ให้รบกวนส่ง URL สำหรับ Callback ทั้งบน UAT และ Production กลับมาให้ทีมเพื่อดำเนินการ Set ในระบบค่ะ)

*** ท่านจะได้รับข้อมูลที่ถูกส่งออกจากอีเมล info_support@maxcard.co.th อีเมลนี้จะเป็นการเข้าดูข้อมูลของร้านค้าเท่านั้น หากต้องการดูข้อมูลการชำระเงินภายใต้ ${companyName} จะต้องเข้าดูผ่าน https://merchant.maxcardpay.com/ เท่านั้น !!!

กรณีมีคำถามเพิ่มเติม หรือติดปัญหาในการเชื่อมต่อสามารถติดต่อแจ้งปัญหาได้ที่ Line OA : Max Card Payment Gateway`;

            displayPreview();
        }

        // Display Preview
        function displayPreview() {
            const preview = document.getElementById('preview');
            preview.innerHTML = '<pre>' + escapeHtml(emailContent) + '</pre>';
            document.getElementById('copyBtn').style.display = 'block';
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // API Button Click
        document.getElementById('generateApiBtn').addEventListener('click', function() {
            const errorMsg = document.getElementById('errorApiMsg');
            errorMsg.style.display = 'none';

            if (validateApiForm()) {
                generateApiEmail();
            } else {
                errorMsg.style.display = 'block';
            }
        });

        // Copy Button Click
        document.getElementById('copyBtn').addEventListener('click', function() {
            navigator.clipboard.writeText(emailContent).then(() => {
                const msg = document.getElementById('successMsg');
                msg.classList.add('show');
                setTimeout(() => msg.classList.remove('show'), 2000);
            });
        });
    </script>
</body>
</html>
