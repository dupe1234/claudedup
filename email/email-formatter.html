<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Formatter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #f8f9fb;
    --border: #e3e6eb;
    --text: #1d2330;
    --muted: #6b7280;
    --accent: #1f6feb;
    --accent-soft: #e8f0fe;
    --ok: #138a4b;
    --ok-soft: #e6f6ed;
    --warn: #b45309;
    --warn-soft: #fff4e0;
    --danger: #c62828;
    --line: #06c755;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b;
      --surface: #1a1e26;
      --surface-2: #20252f;
      --border: #2e3440;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #5b9dff;
      --accent-soft: #1e2b44;
      --ok: #3ccf7f;
      --ok-soft: #173326;
      --warn: #f0a94a;
      --warn-soft: #3a2c15;
      --danger: #ff6b6b;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.55;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 { font-size: 17px; font-weight: 700; }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 9px; border: 1px solid var(--border); }
  .tab {
    border: 0; background: transparent; color: var(--muted);
    padding: 7px 16px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 8px 14px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--danger); }
  .btn.small { padding: 4px 10px; font-size: 12px; }

  main {
    display: grid;
    grid-template-columns: minmax(360px, 520px) 1fr;
    gap: 20px;
    padding: 20px 24px 40px;
    max-width: 1500px;
    margin: 0 auto;
    align-items: start;
  }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .form { padding: 20px; }
  .section { margin-bottom: 22px; }
  .section:last-child { margin-bottom: 0; }
  .section-title {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }
  .env-badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 700; letter-spacing: .04em; }
  .env-badge.uat { background: var(--warn-soft); color: var(--warn); }
  .env-badge.prd { background: var(--ok-soft); color: var(--ok); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .grid2 .field, .grid3 .field { margin-bottom: 0; }
  .grid2 + .field, .grid3 + .field, .field + .grid2, .field + .grid3, .grid2 + .grid3, .grid3 + .grid2 { margin-top: 10px; }
  label { font-size: 12px; font-weight: 600; color: var(--muted); }
  label .req { color: var(--danger); }
  select {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px; cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type="text"], textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface-2); color: var(--text);
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 13px;
  }
  input[type="text"].plain { font-family: inherit; font-size: 14px; }
  textarea { resize: vertical; min-height: 64px; font-family: inherit; font-size: 14px; }
  textarea.template { min-height: 320px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5; white-space: pre; }
  input[type="date"] {
    width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface-2); color: var(--text); font: inherit; font-size: 14px;
  }
  input[type="date"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type="date"].missing { border-color: var(--danger); }
  .example-box {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 7px;
    background: var(--accent-soft); font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px;
  }
  .example-box span { flex: 1; }
  .err { font-size: 12px; color: var(--danger); }
  .tokens { font-size: 12px; color: var(--muted); }
  .tokens code { font-family: 'IBM Plex Mono', monospace; background: var(--surface-2); border: 1px solid var(--border); padding: 0 4px; border-radius: 4px; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
  input.missing { border-color: var(--danger); }
  .hint { font-size: 12px; color: var(--muted); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); font-weight: 500; cursor: pointer; margin-bottom: 6px; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }

  .preview-wrap { position: sticky; top: 76px; }
  .preview-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .preview-head h2 { font-size: 14px; font-weight: 700; margin-right: auto; }
  .status { font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  .status.ok { background: var(--ok-soft); color: var(--ok); }
  .status.warn { background: var(--warn-soft); color: var(--warn); }
  .subject {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface-2); font-size: 13px;
  }
  .subject b { color: var(--muted); font-weight: 600; }
  .subject span { flex: 1; }
  .preview {
    padding: 20px 24px; max-height: calc(100vh - 230px); overflow: auto;
  }
  /* email body: fixed light look, it mirrors what the recipient sees */
  .email {
    background: #fff; color: #222; border-radius: 8px; padding: 22px 26px;
    font-family: Tahoma, 'IBM Plex Sans Thai', sans-serif; font-size: 14px; line-height: 1.7;
    border: 1px solid var(--border);
  }
  .email a { color: #1a5fd0; }
  .email .missing-chip { background: #ffe1e1; color: #b00020; padding: 0 4px; border-radius: 3px; font-weight: 600; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: all .2s ease; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .branch-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .branch-row input { flex: 1; }
  [hidden] { display: none !important; }

  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; padding: 16px; }
    .preview-wrap { position: static; }
    .preview { max-height: none; }
    header { padding: 12px 16px; }
  }
  @media (max-width: 520px) {
    .grid2, .grid3 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>📧 Email Formatter</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="cust" aria-selected="true">email ให้ลูกค้า</button>
    <button class="tab" role="tab" data-tab="promo" aria-selected="false">โปรโมชั่น</button>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost" id="clearBtn" title="ล้างข้อมูลในแท็บนี้">ล้างข้อมูล</button>
</header>

<main>
  <!-- ============ FORM ============ -->
  <div class="card form">

    <!-- API form -->
    <form id="form-cust" autocomplete="off">
      <div class="section">
        <div class="section-title">ผู้รับ</div>
        <div class="field">
          <label>To <span class="req">*</span></label>
          <textarea name="to" rows="2" style="min-height:0" placeholder="อีเมลลูกค้า คั่นด้วย , หรือขึ้นบรรทัดใหม่" required></textarea>
        </div>
        <div class="field">
          <label>CC</label>
          <textarea name="cc" rows="2" style="min-height:0">mec@maxme.co.th</textarea>
        </div>
        <div class="field">
          <label>ชื่อบริษัท <span class="req">*</span></label>
          <input type="text" class="plain" name="company" placeholder="เช่น CP and K Thailand" required>
        </div>
      </div>

      <div class="section">
        <div class="section-title">บริการที่นำส่ง <span class="hint" style="text-transform:none;letter-spacing:0">(เลือกได้หลายอย่าง)</span></div>
        <label class="check"><input type="checkbox" name="svc_api" checked> API (Max Card Payment Gateway)</label>
        <label class="check"><input type="checkbox" name="svc_plara"> ปลาร้า cash</label>
        <label class="check"><input type="checkbox" name="svc_maxpay"> Max Pay</label>
      </div>

      <!-- ===== API ===== -->
      <div data-svc="api">
        <div class="section">
          <div class="section-title">API · ข้อมูลร้านค้า</div>
          <div class="field">
            <label>สาขา <span class="hint">(ว่างไว้ = ใช้ชื่อบริษัท)</span></label>
            <div id="branches"></div>
            <div><button type="button" class="btn small" id="addBranch">+ เพิ่มสาขา</button></div>
          </div>
          <div class="field">
            <label>Password เริ่มต้นของ user รายงาน <span class="req">*</span></label>
            <input type="text" name="password" required>
          </div>
        </div>

        <div class="section">
          <div class="section-title">API · Environment <span class="env-badge uat">UAT</span></div>
          <div class="grid2">
            <div class="field"><label>MID <span class="req">*</span></label><input type="text" name="uat_mid" required></div>
            <div class="field"><label>Client ID <span class="req">*</span></label><input type="text" name="uat_client" required></div>
          </div>
          <div class="field"><label>Secret Key <span class="req">*</span></label><input type="text" name="uat_secret" required></div>
          <div class="grid3">
            <div class="field"><label>User BU <span class="req">*</span></label><input type="text" name="uat_bu" required></div>
            <div class="field"><label>User Shop <span class="req">*</span></label><input type="text" name="uat_shop" required></div>
            <div class="field"><label>User Branch <span class="req">*</span></label><input type="text" name="uat_branch" required></div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">
            <span>API · Environment <span class="env-badge prd">PRD</span></span>
            <button type="button" class="btn small" id="copyUsers" title="คัดลอก username จาก UAT">ใช้ username เดียวกับ UAT</button>
          </div>
          <div class="grid2">
            <div class="field"><label>MID <span class="req">*</span></label><input type="text" name="prd_mid" required></div>
            <div class="field"><label>Client ID <span class="req">*</span></label><input type="text" name="prd_client" required></div>
          </div>
          <div class="field"><label>Secret Key <span class="req">*</span></label><input type="text" name="prd_secret" required></div>
          <div class="grid3">
            <div class="field"><label>User BU <span class="req">*</span></label><input type="text" name="prd_bu" required></div>
            <div class="field"><label>User Shop <span class="req">*</span></label><input type="text" name="prd_shop" required></div>
            <div class="field"><label>User Branch <span class="req">*</span></label><input type="text" name="prd_branch" required></div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">API · ตัวเลือก</div>
          <label class="check"><input type="checkbox" name="opt_callback" checked> ขอ Callback URL จากลูกค้า</label>
          <label class="check"><input type="checkbox" name="opt_notice" checked> แจ้งเรื่องอีเมล info_support@maxcard.co.th</label>
        </div>
      </div>

      <!-- ===== ปลาร้า cash ===== -->
      <div data-svc="plara" hidden>
        <div class="section">
          <div class="section-title">ปลาร้า cash</div>
          <div class="grid2">
            <div class="field"><label>Username <span class="req">*</span></label><input type="text" name="pl_username" required></div>
            <div class="field"><label>Password <span class="req">*</span></label><input type="text" name="pl_password" required></div>
          </div>
          <label class="check" style="margin-top:10px"><input type="checkbox" name="pl_withclient"> เพิ่มรายละเอียด Client ID</label>
          <div data-show="pl_withclient" hidden>
            <div class="grid2" style="margin-top:6px">
              <div class="field"><label>MID <span class="req">*</span></label><input type="text" name="pl_mid" required></div>
              <div class="field"><label>Client ID <span class="req">*</span></label><input type="text" name="pl_client" required></div>
            </div>
            <div class="field" style="margin-top:10px"><label>Secret Key <span class="req">*</span></label><input type="text" name="pl_secret" required></div>
          </div>
        </div>
      </div>

      <!-- ===== Max Pay ===== -->
      <div data-svc="maxpay" hidden>
        <div class="section">
          <div class="section-title">Max Pay Connect</div>
          <div class="grid2">
            <div class="field"><label>Username <span class="req">*</span></label><input type="text" name="mp_username" required></div>
            <div class="field"><label>Password <span class="req">*</span></label><input type="text" name="mp_password" required></div>
          </div>
          <label class="check" style="margin-top:10px"><input type="checkbox" name="mp_withclient"> เพิ่มรายละเอียด Client ID</label>
          <div data-show="mp_withclient" hidden>
            <div class="grid2" style="margin-top:6px">
              <div class="field"><label>MID <span class="req">*</span></label><input type="text" name="mp_mid" required></div>
              <div class="field"><label>Client ID <span class="req">*</span></label><input type="text" name="mp_client" required></div>
            </div>
            <div class="field" style="margin-top:10px"><label>Secret Key <span class="req">*</span></label><input type="text" name="mp_secret" required></div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">ท้ายอีเมล</div>
        <label class="check"><input type="checkbox" name="opt_line" checked> เพิ่มช่องทางติดต่อ LINE OA</label>
        <label class="check"><input type="checkbox" name="opt_qr" checked> แนบ QR Code LINE OA (ตอนคัดลอกแบบอีเมล)</label>
      </div>
    </form>

    <!-- Promotion form -->
    <form id="form-promo" autocomplete="off" hidden>
      <div class="section">
        <div class="section-title">เลือกโปรโมชั่น</div>
        <div class="field">
          <label>โปรโมชั่น <span class="req">*</span></label>
          <select name="promo" id="promoSelect"></select>
          <span class="hint" id="promoDesc"></span>
        </div>
      </div>
      <div id="promoFields"></div>
    </form>

    <!-- Max Pay Connect form -->
  </div>

  <!-- ============ PREVIEW ============ -->
  <div class="card preview-wrap">
    <div class="preview-head">
      <h2>ตัวอย่างอีเมล</h2>
      <span class="status warn" id="status">ยังกรอกไม่ครบ</span>
      <button class="btn" id="copyText">📋 คัดลอกข้อความ</button>
      <button class="btn primary" id="copyRich">✉️ คัดลอกแบบอีเมล</button>
    </div>
    <div class="subject" id="rowTo" hidden>
      <b>To:</b> <span id="toVal"></span>
      <button class="btn small" data-copy="toVal">คัดลอก</button>
    </div>
    <div class="subject" id="rowCc" hidden>
      <b>CC:</b> <span id="ccVal"></span>
      <button class="btn small" data-copy="ccVal">คัดลอก</button>
    </div>
    <div class="subject">
      <b>หัวข้อ:</b> <span id="subject"></span>
      <button class="btn small" id="copySubject">คัดลอก</button>
    </div>
    <div class="preview"><div class="email" id="email"></div></div>
  </div>
</main>

<div class="toast" id="toast"></div>

// ---------- promotion ----------
const currentPromo = () => PROMOS.find(p => p.id === forms.promo.elements.promo.value) || PROMOS[0];
const tplKey = p => 'ef_tpl_v2_' + p.id;   // bump version when the default template changes
function loadTpl(p) { try { return localStorage.getItem(tplKey(p)) ?? p.template; } catch { return p.template; } }
function saveTpl(p, val) { try { val === p.template ? localStorage.removeItem(tplKey(p)) : localStorage.setItem(tplKey(p), val); } catch {} }

// random tail for the e-code example, kept stable until "สุ่มใหม่"
const ALNUM = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789';
const randTail = () => Array.from({ length: 12 }, () => ALNUM[Math.floor(Math.random() * ALNUM.length)]).join('');
let ecodeTails = [randTail(), randTail()];

function renderPromoFields() {
  const p = currentPromo();
  const parts = [];
  let row = [], rowCol = 0;
  const flushRow = () => { if (row.length) { parts.push(`<div class="grid${rowCol}">${row.join('')}</div>`); row = []; } };
  for (const fd of p.fields) {
    const optionalField = fd.header === 'cc' || fd.optional;
    const req = optionalField ? (fd.optional ? ' <span class="hint">(ไม่บังคับ)</span>' : '') : ' <span class="req">*</span>';
    if (fd.col) {
      if (fd.col !== rowCol) flushRow();
      rowCol = fd.col;
      row.push(`<div class="field"><label>${esc(fd.label)}${req}</label>
        <input type="text"${fd.col === 3 || fd.mono ? '' : ' class="plain"'} name="p_${fd.key}" value="${esc(fd.default || '')}" placeholder="${esc(fd.placeholder || '')}"${optionalField ? '' : ' required'}></div>`);
      continue;
    }
    flushRow();
    if (fd.type === 'textarea') {
      parts.push(`<div class="field"><label>${esc(fd.label)}${req}</label>
        <textarea name="p_${fd.key}" rows="3" placeholder="${esc(fd.placeholder || '')}"${optionalField ? '' : ' required'}>${esc(fd.default || '')}</textarea></div>`);
      continue;
    }
    if (fd.type === 'label') {
      parts.push(`<div class="section-title" style="margin-top:18px">${esc(fd.label)}</div>`);
    } else if (fd.type === 'ecode') {
      parts.push(`<div class="field"><label>${esc(fd.label)}${req}</label>
        <input type="text" name="p_${fd.key}" placeholder="${esc(fd.placeholder || '')}" required
               style="text-transform:uppercase"></div>
        <div class="field"><label>Example <span class="hint">(prefix + running 01, 02 + ตัวอักษรสุ่ม รวม ${p.ecodeLength} หลัก)</span></label>
        <div class="example-box"><span id="ecodeExample">—</span>
        <button type="button" class="btn small" id="ecodeShuffle">สุ่มใหม่</button></div></div>`);
    } else if (fd.type === 'daterange') {
      parts.push(`<div class="field"><label>${esc(fd.label)}${req}</label>
        <div class="grid2">
          <input type="date" name="p_${fd.key}_start" required aria-label="วันเริ่ม">
          <input type="date" name="p_${fd.key}_end" required aria-label="วันสิ้นสุด">
        </div>
        <span class="err" id="err_${fd.key}" hidden>วันสิ้นสุดต้องไม่ก่อนวันเริ่ม</span></div>`);
    } else {
      const tag = fd.header
        ? `<textarea name="p_${fd.key}" rows="2" style="min-height:0"${fd.header === 'cc' ? '' : ' required'}>${esc(fd.default || '')}</textarea>`
        : `<input type="text" class="plain" name="p_${fd.key}" value="${esc(fd.default || '')}" placeholder="${esc(fd.placeholder || '')}" required>`;
      parts.push(`<div class="field"><label>${esc(fd.label)}${req}</label>${tag}</div>`);
    }
  }
  flushRow();
  const tokens = [...p.fields.filter(f => f.key && !f.header).flatMap(f => f.type === 'ecode' ? ['{prefix}', '{example}'] : ['{' + f.key + '}'])];
  parts.push(`<div class="section-title" style="margin-top:18px">
      <span>Format email</span>
      <button type="button" class="btn small" id="tplReset">คืนค่าเริ่มต้น</button></div>
    <div class="field">
      <textarea class="template" name="p_template" spellcheck="false"></textarea>
      <span class="tokens">ตัวแปรที่ใช้ได้: ${[...new Set(tokens)].map(t => `<code>${esc(t)}</code>`).join(' ')}</span>
    </div>`);
  $('promoFields').innerHTML = parts.join('');
  forms.promo.elements.p_template.value = loadTpl(p);

  if ($('ecodeShuffle')) $('ecodeShuffle').onclick = () => { ecodeTails = [randTail(), randTail()]; render(); };
  $('tplReset').onclick = () => {
    if (!confirm('คืนค่า Format email เป็นค่าเริ่มต้น?')) return;
    forms.promo.elements.p_template.value = p.template; saveTpl(p, p.template); render();
  };
}

const ddmm = iso => { const [, m, d] = iso.split('-'); return `${d}/${m}`; };
function promoValue(f, p, key) {
  const fd = p.fields.find(x => x.key === key);
  if (key === 'example') {
    const pre = (f.elements.p_prefix?.value || '').trim().toUpperCase();
    if (!pre) return MISSING + 'Example' + MISSING;
    return [1, 2].map((n, i) => (pre + String(n).padStart(2, '0') + ecodeTails[i]).slice(0, p.ecodeLength)).join(' , ');
  }
  if (!fd) return null;
  if (fd.type === 'daterange') {
    const s = f.elements[`p_${key}_start`]?.value, e = f.elements[`p_${key}_end`]?.value;
    if (!s || !e) return MISSING + fd.label + MISSING;
    if (e < s) return MISSING + fd.label + ' ไม่ถูกต้อง' + MISSING;
    return `${ddmm(s)} - ${ddmm(e)}`;
  }
  if (fd.type === 'ecode') {
    const val = (f.elements['p_' + key]?.value || '').trim().toUpperCase();
    return val || MISSING + fd.label + MISSING;
  }
  if (fd.optional) return (f.elements['p_' + key]?.value || '').trim();
  return v(f, 'p_' + key, fd.label);
}
// drop template lines whose optional fields were left empty
function dropEmptyOptional(text, f, p) {
  const empty = p.fields.filter(fd => fd.optional && !(f.elements['p_' + fd.key]?.value || '').trim()).map(fd => '{' + fd.key + '}');
  if (!empty.length) return text;
  return text.split('\n').filter(line => !empty.some(t => line.includes(t))).join('\n');
}
const fillTokens = (text, f, p) => text.replace(/\{(\w+)\}/g, (m, k) => promoValue(f, p, k) ?? m);
const emailList = s => s.split(/[,;\n]+/).map(x => x.trim()).filter(Boolean).join('; ');

function buildPromo(f) {
  const p = currentPromo();
  // live side effects of the form: e-code example + date errors
  if ($('ecodeExample')) {
    const ex = promoValue(f, p, 'example');
    $('ecodeExample').textContent = ex.includes(MISSING) ? '— กรอก prefix ก่อน —' : ex;
  }
  p.fields.filter(x => x.type === 'daterange').forEach(fd => {
    const s = f.elements[`p_${fd.key}_start`].value, e = f.elements[`p_${fd.key}_end`].value;
    const bad = s && e && e < s;
    $('err_' + fd.key).hidden = !bad;
    f.elements[`p_${fd.key}_end`].classList.toggle('missing', !!bad);
  });
  return fillTokens(dropEmptyOptional(f.elements.p_template.value, f, p), f, p);
}

function subjectFor(f) {
  if (tab === 'promo') return toPlain(fillTokens(currentPromo().subject, f, currentPromo()));
  const c = (f.elements.company.value || '').trim() || '[ชื่อบริษัท]';
  return `Max Card Payment Gateway : นำส่งข้อมูลสำหรับการเชื่อมต่อของ ${c}`;
}

// ---------- outputs ----------
const missingRe = new RegExp(MISSING + '([^' + MISSING + ']*)' + MISSING, 'g');
const toPlain = raw => raw.replace(missingRe, '[$1]');

// Turn the plain template into email-friendly HTML.
function toHtml(raw, { preview = false, qr = false } = {}) {
  const lines = raw.split('\n').map(line => {
    let h = esc(line)
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1">$1</a>')
      .replace(missingRe, (_, l) => preview ? `<span class="missing-chip">[${esc(l)}]</span>` : `[${esc(l)}]`);
    if (/^\d+\.\s+Environment/.test(line) || /^■ /.test(line)) return `<b style="font-size:15px;color:#0b3d91">${h}</b>`;
    if (/^\d+\.\d+\s/.test(line) || /^ผู้ใช้งาน ระดับ/.test(line) || /^ข้อมูลการเชื่อมต่อ$/.test(line) || /^ข้อมูลสาขา/.test(line) || /^\[.+\]$/.test(line)) return `<b>${h}</b>`;
    if (/^\*\*\*/.test(line) || /^(เป็น static code|วันที่เข้าร่วม promotion|วันที่สามารถ(ใช้ )?ecode)/.test(line)) return `<span style="color:#c62828"><b>${h}</b></span>`;
    if (/^\(.*\)$/.test(line)) return `<span style="color:#555"><i>${h}</i></span>`;
    h = h.replace(/^(MID|Client ID|Secret Key|username|password) : /i, '<span style="color:#555">$1 :</span> ');
    return h.replace(/^ +/, s => '&nbsp;'.repeat(s.length));   // keep indentation
  });
  let body = lines.join('<br>');
  if (qr) body += `<br><br><img src="${QR_SRC}" alt="LINE OA QR Code" width="160" height="160" style="width:160px;height:160px">`;
  return `<div style="font-family:Tahoma,sans-serif;font-size:14px;line-height:1.7;color:#222">${body}</div>`;
}

let current = { raw: '', complete: false };
const wantQr = f => on(f, 'opt_qr') && on(f, 'opt_line');

function render() {
  const f = forms[tab];
  if (tab === 'cust') syncCustSections();
  const raw = tab === 'promo' ? buildPromo(f) : buildCust(f);
  // To / CC rows
  const E = f.elements;
  const to = emailList((E.p_to || E.to)?.value || '');
  const cc = emailList((E.p_cc || E.cc)?.value || '');
  $('rowTo').hidden = false; $('rowCc').hidden = !cc;
  $('toVal').textContent = to || '[ยังไม่ได้ใส่ To]';
  $('ccVal').textContent = cc;
  const complete = !raw.includes(MISSING) && !!to;
  current = { raw, complete };
  $('email').innerHTML = toHtml(raw, { preview: true, qr: wantQr(f) });
  $('subject').textContent = subjectFor(f);
  const s = $('status');
  s.textContent = complete ? 'พร้อมส่ง' : `ยังขาด ${(raw.match(missingRe) || []).length} จุด`;
  s.className = 'status ' + (complete ? 'ok' : 'warn');
  f.querySelectorAll('input[required]').forEach(i => i.classList.toggle('missing', !!i.dataset.touched && !i.value.trim()));
}

// ---------- copy ----------
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}
function confirmIfIncomplete() {
  if (current.complete) return true;
  forms[tab].querySelectorAll('input[required]').forEach(i => i.dataset.touched = 1);
  render();
  return confirm('ยังกรอกข้อมูลไม่ครบ ช่องที่ขาดจะแสดงเป็น [ ... ] ต้องการคัดลอกต่อไหม?');
}
async function copyPlain(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { fallbackCopy(text); toast(msg); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy'); ta.remove();
}

$('copyText').onclick = () => { if (confirmIfIncomplete()) copyPlain(toPlain(current.raw), '✓ คัดลอกข้อความแล้ว'); };
$('copySubject').onclick = () => copyPlain($('subject').textContent, '✓ คัดลอกหัวข้อแล้ว');
document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copyPlain($(b.dataset.copy).textContent, '✓ คัดลอกแล้ว'));
$('copyRich').onclick = async () => {
  if (!confirmIfIncomplete()) return;
  const f = forms[tab];
  const html = toHtml(current.raw, { qr: wantQr(f) });
  const plain = toPlain(current.raw);
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([plain], { type: 'text/plain' }),
    })]);
    toast('✓ คัดลอกแล้ว วางในอีเมลได้เลย');
  } catch {
    // Fallback: select rendered HTML and copy
    const box = document.createElement('div');
    box.innerHTML = html; box.style.position = 'fixed'; box.style.left = '-9999px';
    document.body.appendChild(box);
    const r = document.createRange(); r.selectNodeContents(box);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    document.execCommand('copy'); sel.removeAllRanges(); box.remove();
    toast('✓ คัดลอกแล้ว วางในอีเมลได้เลย');
  }
};

// ---------- events ----------
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b));
  Object.entries(forms).forEach(([k, f]) => f.hidden = k !== tab);
  try { localStorage.setItem('ef_tab', tab); } catch {}
  render();
});
Object.values(forms).forEach(f => {
  f.addEventListener('input', e => {
    if (e.target.matches('input[required]')) e.target.dataset.touched = 1;
    if (e.target.name === 'p_template') saveTpl(currentPromo(), e.target.value);
    render();
  });
  f.addEventListener('change', render);
  f.addEventListener('submit', e => e.preventDefault());
  // paste: trim whitespace/newlines that often come along when copying from sheets/portals
  f.addEventListener('paste', e => {
    if (!e.target.matches('input[type="text"]')) return;
    const t = (e.clipboardData || window.clipboardData).getData('text');
    if (t !== t.trim()) { e.preventDefault(); document.execCommand('insertText', false, t.trim()); }
  });
});
$('addBranch').onclick = () => { addBranchRow(); $('branches').lastElementChild.querySelector('input').focus(); };
$('copyUsers').onclick = () => {
  const e = forms.cust.elements;
  ['bu', 'shop', 'branch'].forEach(k => { if (e['uat_' + k].value) e['prd_' + k].value = e['uat_' + k].value; });
  render();
};
$('clearBtn').onclick = () => {
  if (!confirm('ล้างข้อมูลทั้งหมดในแท็บนี้?')) return;
  const f = forms[tab];
  f.reset();
  f.querySelectorAll('input').forEach(i => delete i.dataset.touched);
  if (tab === 'cust') { $('branches').innerHTML = ''; addBranchRow(); f.elements.password.value = DEFAULT_PASSWORD; }
  if (tab === 'promo') { $('promoFields').innerHTML = ''; renderPromoFields(); }
  render();
};
$('promoSelect').addEventListener('change', () => { renderPromoFields(); render(); });

// ---------- init ----------
$('promoSelect').innerHTML = PROMOS.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
renderPromoFields();
addBranchRow();
forms.cust.elements.password.value = DEFAULT_PASSWORD;
try { const t = localStorage.getItem('ef_tab'); if (t && forms[t]) document.querySelector(`.tab[data-tab="${t}"]`).click(); } catch {}
render();
</script>
</body>
</html>
