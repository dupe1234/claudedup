<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dupli Tools</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5fbf'/%3E%3Crect x='7' y='7' width='8' height='8' rx='2' fill='%23fff'/%3E%3Crect x='17' y='7' width='8' height='8' rx='2' fill='%23fff' opacity='.7'/%3E%3Crect x='7' y='17' width='8' height='8' rx='2' fill='%23fff' opacity='.7'/%3E%3Crect x='17' y='17' width='8' height='8' rx='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column; two large choice buttons side by side (stacked on phones). Email reveals its two tools below. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --fg: #17212b;
  --muted: #5c6b79;
  --line: #d5dce3;
  --accent: #1f5fbf;
  --accent-soft: #e3ecfa;
  --mail: #c4622d;
  --mail-soft: #fbeee6;
  --f-body: "IBM Plex Sans Thai", "Sukhumvit Set", "Thonburi", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171d; --surface: #1c232b; --fg: #e4e9ee; --muted: #93a1ae; --line: #2c3640;
  --accent: #5b9bf0; --accent-soft: #1d2e47; --mail: #ec9461; --mail-soft: #3a2619; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1c232b; --fg: #e4e9ee; --muted: #93a1ae; --line: #2c3640;
  --accent: #5b9bf0; --accent-soft: #1d2e47; --mail: #ec9461; --mail-soft: #3a2619; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5 }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px }

main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px;
  padding-block: 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.intro { text-align: center }
h1 { margin: 0; font-size: clamp(24px, 5vw, 34px); font-weight: 700; text-wrap: balance }
.intro p { margin: 6px 0 0; color: var(--muted) }

.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 260px)); gap: 20px; width: 100%; justify-content: center }
.choice { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 220px; padding: 28px 20px;
  border: 2px solid var(--line); border-radius: 18px; background: var(--surface); text-decoration: none; color: var(--fg); text-align: center;
  box-shadow: 0 2px 6px rgba(23, 33, 43, .06); transition: transform .15s, border-color .15s, box-shadow .15s }
.choice:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(23, 33, 43, .12) }
.choice:active { transform: translateY(0) }
.choice .ico { width: 76px; height: 76px; border-radius: 20px; display: grid; place-items: center }
.choice svg { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.choice b { font-size: 22px; line-height: 1.2 }
.choice span.d { color: var(--muted); font-size: 14px }
.task .ico { background: var(--accent-soft); color: var(--accent) }
.task:hover, .task:focus-visible { border-color: var(--accent) }
.mail .ico { background: var(--mail-soft); color: var(--mail) }
.mail:hover, .mail:focus-visible, .mail[aria-expanded="true"] { border-color: var(--mail) }

.sub { width: min(540px, 100%); display: flex; flex-direction: column; gap: 10px }
.sub h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center }
.sub a { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); text-decoration: none; transition: border-color .15s }
.sub a:hover { border-color: var(--mail) }
.sub a .ico { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--mail-soft); color: var(--mail); font-weight: 700; font-size: 13px }
.sub a b { display: block }
.sub a span.d { display: block; font-size: 13px; color: var(--muted) }
.sub a .go { margin-left: auto; color: var(--muted); font-size: 20px }

@media (max-width: 560px) {
  main { justify-content: flex-start; padding-block: 48px 32px }
  .choices { grid-template-columns: 1fr; gap: 14px }
  .choice { min-height: 0; flex-direction: row; justify-content: flex-start; text-align: left; padding: 18px; gap: 16px }
  .choice .ico { width: 60px; height: 60px; border-radius: 16px; flex: none }
  .choice svg { width: 32px; height: 32px }
  .choice b { font-size: 19px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>
<main>
  <div class="intro">
    <h1>เลือกเครื่องมือที่จะใช้</h1>
    <p>Dupli Tools</p>
  </div>

  <div class="choices">
    <button type="button" class="choice mail" id="mailBtn" aria-expanded="false" aria-controls="mailTools">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></span>
      <span><b>Email</b><br><span class="d">จัดรูปแบบอีเมลส่งลูกค้า</span></span>
    </button>
    <a class="choice task" href="toolwork/taskboard.html">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="7" rx="1.5"/></svg></span>
      <span><b>Task Job</b><br><span class="d">บอร์ดงาน, Spec และ Note ของทีม</span></span>
    </a>
  </div>

  <section class="sub" id="mailTools" hidden aria-label="เครื่องมืออีเมล">
    <h2>เลือกรูปแบบอีเมล</h2>
    <a href="email/api-formatter.html">
      <span class="ico">API</span>
      <span><b>API Email Formatter</b><span class="d">Email Formatter - API</span></span>
      <span class="go" aria-hidden="true">›</span>
    </a>
    <a href="email/maxpay-formatter.html">
      <span class="ico">MPC</span>
      <span><b>Max Pay Connect Formatter</b><span class="d">Email Formatter - Max Pay Connect</span></span>
      <span class="go" aria-hidden="true">›</span>
    </a>
  </section>
</main>
<script>
const btn = document.getElementById("mailBtn"), tools = document.getElementById("mailTools");
btn.addEventListener("click", () => {
  const open = btn.getAttribute("aria-expanded") !== "true";
  btn.setAttribute("aria-expanded", open);
  tools.hidden = !open;
  if (open) tools.querySelector("a").focus({ preventScroll: true }), tools.scrollIntoView({ behavior: "smooth", block: "nearest" });
});
</script>
</body>
</html>
