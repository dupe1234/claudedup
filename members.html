<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สมาชิก</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5fbf'/%3E%3Ccircle cx='16' cy='12' r='5' fill='%23fff'/%3E%3Cpath d='M7 26c0-5 4-8 9-8s9 3 9 8z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single column of member rows grouped by status; pending requests first. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --col: #e9edf1;
  --fg: #17212b;
  --muted: #5c6b79;
  --line: #d5dce3;
  --accent: #1f5fbf;
  --accent-fg: #ffffff;
  --accent-soft: #e3ecfa;
  --ok: #2f8f4e;
  --danger: #c9372c;
  --warn: #b57800;
  --f-body: "IBM Plex Sans Thai", "Sukhumvit Set", "Thonburi", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171d; --surface: #1c232b; --col: #171d24; --fg: #e4e9ee; --muted: #93a1ae; --line: #2c3640;
  --accent: #5b9bf0; --accent-fg: #0d1520; --accent-soft: #1d2e47; --ok: #57c47a; --danger: #f0675c; --warn: #e0b23c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1c232b; --col: #171d24; --fg: #e4e9ee; --muted: #93a1ae; --line: #2c3640;
  --accent: #5b9bf0; --accent-fg: #0d1520; --accent-soft: #1d2e47; --ok: #57c47a; --danger: #f0675c; --warn: #e0b23c; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5 }
button { font: inherit; color: inherit; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { background: var(--surface); border-bottom: 1px solid var(--line) }
.appnav { display: flex; align-items: center; gap: 8px; padding-block: 10px; flex-wrap: wrap }
.appnav a { display: inline-flex; align-items: center; gap: 8px; flex: none; padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); text-decoration: none; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 1px rgba(23,33,43,.06); transition: background .15s, border-color .15s, color .15s }
.appnav a svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.appnav a:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.appnav a:active { transform: translateY(1px) }
.appnav a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
@media (max-width: 560px) { .appnav a { padding: 7px 10px } .appnav a .lbl-long { display: none } }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 12px; font-weight: 500 }
.btn:hover { background: var(--col) }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.btn.danger { color: var(--danger) }
.btn:disabled { opacity: .5; cursor: default }

main { max-width: 760px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 20px }
h1 { margin: 0; font-size: 20px; text-wrap: balance }
.lead { margin: 4px 0 0; color: var(--muted) }
section h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 8px }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line) }
.row:first-child { border-top: 0 }
.who { flex: 1; min-width: 0 }
.who b { display: block; overflow-wrap: anywhere }
.who span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.pill { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 8px }
.pill.pending { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn) }
.pill.approved { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok) }
.pill.rejected { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger) }
.pill.admin { background: var(--accent-soft); color: var(--accent) }
.actions { display: flex; gap: 6px }
.empty { color: var(--muted); padding: 16px 14px }
.denied { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px; color: var(--muted) }
@media (max-width: 600px) {
  main { padding-block: 16px 32px }
  .row { padding: 12px }
  .actions { flex-basis: 100%; justify-content: flex-end }
  .actions .btn { flex: 1; padding: 9px 12px }
}
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 6px; z-index: 30; font-size: 13px }
</style>
</head>
<body>
<header>
  <nav class="wrap appnav" aria-label="เครื่องมือ">
    <a href="taskboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="7" rx="1.5"/></svg><span>บอร์ดงาน</span></a>
    <a href="spec.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7l2 2 3.5-3.5M3.5 16l2 2 3.5-3.5M13 8h8M13 17h8"/></svg><span>Spec<span class="lbl-long"> Payment Gateway</span></span></a>
    <a href="notes.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/></svg><span>Note</span></a>
  </nav>
</header>

<main class="wrap">
  <div>
    <h1>สมาชิก</h1>
    <p class="lead">คนที่สมัครใหม่จะใช้บอร์ดงานและ Note ได้หลังจากผู้ดูแลอนุมัติ</p>
  </div>
  <div id="denied" class="denied" hidden>หน้านี้สำหรับผู้ดูแลเท่านั้น</div>
  <div id="groups"></div>
</main>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const GROUPS = [
  { status: "pending", name: "รออนุมัติ", empty: "ไม่มีคำขอใหม่" },
  { status: "approved", name: "อนุมัติแล้ว", empty: "ยังไม่มีสมาชิก" },
  { status: "rejected", name: "ปฏิเสธแล้ว", empty: "ไม่มี" },
];
const LABEL = { pending: "รออนุมัติ", approved: "อนุมัติแล้ว", rejected: "ปฏิเสธ" };
let me = null, members = [];

const fmt = iso => iso ? new Date(iso).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" }) : "";
function actions(m) {
  if (m.user_id === me.id) return "";
  const b = (status, text, cls = "") => `<button class="btn ${cls}" type="button" data-id="${m.user_id}" data-status="${status}">${text}</button>`;
  if (m.status === "pending") return b("approved", "อนุมัติ", "primary") + b("rejected", "ปฏิเสธ", "danger");
  if (m.status === "approved") return b("rejected", "ยกเลิกสิทธิ์", "danger");
  return b("approved", "อนุมัติ");
}
function render() {
  $("groups").innerHTML = GROUPS.map(g => {
    const rows = members.filter(m => m.status === g.status);
    return `<section><h2>${g.name} (${rows.length})</h2><div class="list">
      ${rows.map(m => `<div class="row">
        <div class="who"><b>${esc(m.email)}</b>
          <span>สมัคร ${fmt(m.requested_at)}${m.decided_at && m.status !== "pending" ? ` · ${LABEL[m.status]} ${fmt(m.decided_at)}` : ""}</span></div>
        ${m.is_admin ? `<span class="pill admin">ผู้ดูแล</span>` : ""}
        <span class="pill ${m.status}">${LABEL[m.status]}</span>
        <div class="actions">${actions(m)}</div>
      </div>`).join("") || `<div class="empty">${g.empty}</div>`}
    </div></section>`;
  }).join("");
}
async function load() {
  const { data, error } = await sb.from("members").select("user_id,email,status,is_admin,requested_at,decided_at").order("requested_at", { ascending: false });
  if (error) return toast("โหลดรายชื่อไม่สำเร็จ: " + error.message);
  members = data;
  render();
}
$("groups").addEventListener("click", async e => {
  const b = e.target.closest("[data-status]"); if (!b) return;
  b.disabled = true;
  const { error } = await sb.rpc("set_member_status", { target: b.dataset.id, new_status: b.dataset.status });
  if (error) { b.disabled = false; return toast(error.message) }
  const m = members.find(x => x.user_id === b.dataset.id);
  toast(`${m?.email || "สมาชิก"}: ${LABEL[b.dataset.status]}`);
  load();
});
let toastT;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2400) }

requireUser().then(({ user, member }) => {
  me = user;
  if (!member.is_admin) { $("denied").hidden = false; return }
  load();
  sb.channel("members-admin").on("postgres_changes", { event: "*", schema: "public", table: "members" }, load).subscribe();
});
</script>
</body>
</html>
