<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — ที่ปรึกษา Storyboard &amp; Content</title>
<style>
  :root {
    --bg: #f7f5f2;
    --panel: #ffffff;
    --border: #e4ddd3;
    --text: #2b2622;
    --text-dim: #7a7168;
    --accent: #b5562f;
    --accent-dim: #d98a5e;
    --danger: #b3413a;
    --shadow: 0 1px 2px rgba(43,38,34,0.06), 0 4px 16px rgba(43,38,34,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a18;
      --panel: #262320;
      --border: #3a3530;
      --text: #ede7e0;
      --text-dim: #a89e93;
      --accent: #e08657;
      --accent-dim: #8a5638;
      --danger: #e08d86;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 4px 20px rgba(0,0,0,0.25);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Sarabun", "IBM Plex Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { font-size: 13px; color: var(--text-dim); margin: 0 0 24px; line-height: 1.6; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  label { font-size: 12px; color: var(--text-dim); }
  input[type=text], input[type=password] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 11px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
  }
  input:focus { border-color: var(--accent); }
  button {
    font-family: inherit;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 9px 14px;
    font-size: 13px;
  }
  button:hover { border-color: var(--accent-dim); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-dim); }
  button.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #loginError, #msg { font-size: 12px; min-height: 16px; }
  #loginError { color: var(--danger); }
  #msg.ok { color: #3a7d44; }
  #msg.err { color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 600; font-size: 12px; }
  .bar-track { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; width: 120px; }
  .bar-fill { height: 100%; background: var(--accent); }
  .bar-fill.over { background: var(--danger); }
  .row-actions { display: flex; gap: 6px; }
  .addRow { display: flex; gap: 8px; margin-top: 14px; }
  .addRow input { flex: 1; }
  #totalLine { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🔐 Admin — ที่ปรึกษา Storyboard &amp; Content</h1>
  <p class="sub">จัดการรายชื่ออีเมลที่มีสิทธิ์เข้าใช้งาน และดูสัดส่วนการใช้ token ของแต่ละคน (จำกัดไม่เกิน 25% ของยอดรวม)</p>

  <div class="card" id="loginCard">
    <div class="field">
      <label for="adminEmail">อีเมลผู้ดูแลระบบ</label>
      <input type="text" id="adminEmail" placeholder="dupli.pasu@gmail.com" autocomplete="username" />
    </div>
    <div class="field">
      <label for="adminPass">Passphrase</label>
      <input type="password" id="adminPass" placeholder="passphrase ที่ตั้งไว้ใน Worker" autocomplete="current-password" />
    </div>
    <button class="primary" id="loginBtn">เข้าสู่ระบบ Admin</button>
    <div id="loginError"></div>
  </div>

  <div class="card hidden" id="panel">
    <div id="totalLine"></div>
    <table>
      <thead>
        <tr><th>อีเมล</th><th>Token ใช้ไป</th><th>% ของยอดรวม</th><th></th></tr>
      </thead>
      <tbody id="userRows"></tbody>
    </table>

    <div class="addRow">
      <input type="text" id="newEmail" placeholder="เพิ่มอีเมลใหม่ เช่น friend@example.com" />
      <button id="addBtn">＋ เพิ่มสิทธิ์</button>
    </div>

    <div class="row-actions" style="margin-top:16px;">
      <button id="refreshBtn">🔄 รีเฟรช</button>
      <button class="danger" id="resetAllBtn">รีเซ็ตยอดใช้งานทั้งหมด</button>
      <button class="ghost" id="logoutBtn">ออกจากระบบ Admin</button>
    </div>
    <div id="msg"></div>
  </div>
</div>

<script>
(function () {
  // Same Worker URL as index.html — paste it here too after deploying.
  const WORKER_URL = "REPLACE_WITH_YOUR_WORKER_URL";
  const LS_KEY = "sc_admin_creds";

  const el = (id) => document.getElementById(id);
  const loginCard = el("loginCard");
  const panel = el("panel");
  const adminEmail = el("adminEmail");
  const adminPass = el("adminPass");
  const loginError = el("loginError");
  const userRows = el("userRows");
  const totalLine = el("totalLine");
  const msg = el("msg");

  let creds = null;

  function workerConfigured() {
    return /^https?:\/\//.test(WORKER_URL);
  }

  function authHeaders() {
    return {
      "content-type": "application/json",
      "X-Admin-Email": creds.email,
      "X-Admin-Passphrase": creds.pass,
    };
  }

  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = ok ? "ok" : "err";
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  async function loadUsers() {
    const res = await fetch(WORKER_URL + "/admin/users", { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || data.error || "โหลดข้อมูลไม่สำเร็จ");
    totalLine.textContent = `ยอดรวม token ที่ใช้สะสม: ${data.total.toLocaleString()} — จำกัดผู้ใช้แต่ละคนไม่เกิน ${Math.round(data.quotaShareLimit * 100)}%`;
    userRows.innerHTML = "";
    data.users.forEach((u) => {
      const tr = document.createElement("tr");
      const safeEmail = escapeHtml(u.email);
      tr.innerHTML = `
        <td>${safeEmail}</td>
        <td>${u.tokens.toLocaleString()}</td>
        <td>
          <div class="bar-track"><div class="bar-fill ${u.percent >= 25 ? "over" : ""}" style="width:${Math.min(u.percent, 100)}%"></div></div>
          <span style="font-size:11px;color:var(--text-dim)">${u.percent}%</span>
        </td>
        <td class="row-actions">
          <button data-action="reset" data-email="${safeEmail}">รีเซ็ต</button>
          <button data-action="remove" data-email="${safeEmail}" class="danger">ลบสิทธิ์</button>
        </td>`;
      userRows.appendChild(tr);
    });
  }

  userRows.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const email = btn.dataset.email;
    const action = btn.dataset.action;
    btn.disabled = true;
    try {
      if (action === "remove") {
        if (!confirm(`ลบสิทธิ์การใช้งานของ ${email}?`)) return;
        const res = await fetch(WORKER_URL + "/admin/users", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ action: "remove", email }),
        });
        if (!res.ok) throw new Error((await res.json()).message || "ลบไม่สำเร็จ");
        showMsg(`ลบสิทธิ์ ${email} แล้ว`, true);
      } else if (action === "reset") {
        const res = await fetch(WORKER_URL + "/admin/reset", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ email }),
        });
        if (!res.ok) throw new Error((await res.json()).message || "รีเซ็ตไม่สำเร็จ");
        showMsg(`รีเซ็ตยอดใช้งานของ ${email} แล้ว`, true);
      }
      await loadUsers();
    } catch (err) {
      showMsg(err.message, false);
    } finally {
      btn.disabled = false;
    }
  });

  el("addBtn").addEventListener("click", async () => {
    const email = el("newEmail").value.trim().toLowerCase();
    if (!email || !email.includes("@")) {
      showMsg("กรุณากรอกอีเมลให้ถูกต้อง", false);
      return;
    }
    try {
      const res = await fetch(WORKER_URL + "/admin/users", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ action: "add", email }),
      });
      if (!res.ok) throw new Error((await res.json()).message || "เพิ่มไม่สำเร็จ");
      el("newEmail").value = "";
      showMsg(`เพิ่มสิทธิ์ ${email} แล้ว`, true);
      await loadUsers();
    } catch (err) {
      showMsg(err.message, false);
    }
  });

  el("resetAllBtn").addEventListener("click", async () => {
    if (!confirm("รีเซ็ตยอดใช้งานของทุกคนเป็น 0? (ใช้ตอนเริ่มรอบใหม่)")) return;
    try {
      const res = await fetch(WORKER_URL + "/admin/reset", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({}),
      });
      if (!res.ok) throw new Error((await res.json()).message || "รีเซ็ตไม่สำเร็จ");
      showMsg("รีเซ็ตยอดใช้งานทั้งหมดแล้ว", true);
      await loadUsers();
    } catch (err) {
      showMsg(err.message, false);
    }
  });

  el("refreshBtn").addEventListener("click", () => loadUsers().catch((e) => showMsg(e.message, false)));

  el("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem(LS_KEY);
    creds = null;
    panel.classList.add("hidden");
    loginCard.classList.remove("hidden");
  });

  el("loginBtn").addEventListener("click", async () => {
    if (!workerConfigured()) {
      loginError.textContent = "ยังไม่ได้ตั้งค่า WORKER_URL (แก้ไขใน admin.html)";
      return;
    }
    const email = adminEmail.value.trim().toLowerCase();
    const pass = adminPass.value;
    if (!email || !pass) {
      loginError.textContent = "กรอกอีเมลและ passphrase ให้ครบ";
      return;
    }
    creds = { email, pass };
    try {
      await loadUsers();
      loginError.textContent = "";
      localStorage.setItem(LS_KEY, JSON.stringify(creds));
      loginCard.classList.add("hidden");
      panel.classList.remove("hidden");
    } catch (e) {
      loginError.textContent = "เข้าสู่ระบบไม่สำเร็จ: " + e.message;
      creds = null;
    }
  });

  // restore remembered admin session in this browser
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (saved && saved.email && saved.pass) {
      creds = saved;
      adminEmail.value = saved.email;
      loadUsers()
        .then(() => {
          loginCard.classList.add("hidden");
          panel.classList.remove("hidden");
        })
        .catch(() => {
          localStorage.removeItem(LS_KEY);
          creds = null;
        });
    }
  } catch (e) {}
})();
</script>
</body>
</html>
