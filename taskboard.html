<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>บอร์ดงานทีม</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5fbf'/%3E%3Crect x='6' y='7' width='5.5' height='18' rx='1.5' fill='%23fff'/%3E%3Crect x='13.25' y='7' width='5.5' height='12' rx='1.5' fill='%23fff'/%3E%3Crect x='20.5' y='7' width='5.5' height='7' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky toolbar over a horizontally scrolling 4-column board; list view swaps the board for a table. Detail opens as a side drawer. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --col: #e9edf1;
  --fg: #17212b;
  --muted: #5c6b79;
  --line: #d5dce3;
  --accent: #1f5fbf;
  --accent-fg: #ffffff;
  --accent-soft: #e3ecfa;
  --bug: #c9372c;
  --story: #2f8f4e;
  --task: #2c7be5;
  --p-high: #d0451b;
  --p-med: #c58a00;
  --p-low: #3d8bd4;
  --shadow: 0 1px 2px rgba(23,33,43,.12);
  --f-body: "IBM Plex Sans Thai", "Sukhumvit Set", "Thonburi", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171d; --surface: #1c232b; --col: #171d24; --fg: #e4e9ee; --muted: #93a1ae; --line: #2c3640;
  --accent: #5b9bf0; --accent-fg: #0d1520; --accent-soft: #1d2e47;
  --bug: #f0675c; --story: #57c47a; --task: #5b9bf0; --p-high: #f07a4f; --p-med: #e0b23c; --p-low: #6aaee8;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171d; --surface: #1c232b; --col: #171d24; --fg: #e4e9ee; --muted: #93a1ae; --line: #2c3640;
  --accent: #5b9bf0; --accent-fg: #0d1520; --accent-soft: #1d2e47;
  --bug: #f0675c; --story: #57c47a; --task: #5b9bf0; --p-high: #f07a4f; --p-med: #e0b23c; --p-low: #6aaee8;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0 }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.appnav { display: flex; align-items: center; gap: 8px; padding-block: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.appnav a { display: inline-flex; align-items: center; gap: 8px; flex: none; padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); text-decoration: none; font-weight: 600; white-space: nowrap; box-shadow: 0 1px 1px rgba(23,33,43,.06); transition: background .15s, border-color .15s, color .15s }
.appnav a svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.appnav a:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.appnav a:active { transform: translateY(1px) }
.appnav a[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
@media (max-width: 560px) { .appnav a { padding: 7px 10px } .appnav a .lbl-long { display: none } }
.head-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 12px }
.crumb { font-size: 12px; color: var(--muted); letter-spacing: .02em }
h1 { margin: 0; font-size: 20px; font-weight: 700; text-wrap: balance }
.title-block { flex: 1 1 200px; min-width: 0 }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-weight: 500 }
.btn:hover { background: var(--col) }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.btn.primary:hover { filter: brightness(1.08) }
.btn.danger { color: var(--bug) }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-bottom: 12px }
.search { flex: 1 1 200px; min-width: 0; max-width: 320px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 10px }
.tools select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 8px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-left: auto }
.seg button { border: 0; background: var(--surface); padding: 6px 12px }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.status-note { font-size: 12px; color: var(--muted) }

main { padding-block: 16px 32px }
.board { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px }
.column { background: var(--col); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 200px; transition: background .15s }
.column.over { background: var(--accent-soft) }
.col-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.col-head .count { background: var(--surface); border-radius: 10px; padding: 0 8px; font-variant-numeric: tabular-nums; letter-spacing: 0 }
.col-head .pts { margin-left: auto; font-weight: 500; letter-spacing: 0; text-transform: none }
.col-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 16px 8px; border: 1px dashed var(--line); border-radius: 6px }
.quick-add { border: 0; background: transparent; color: var(--muted); text-align: left; padding: 6px 8px; border-radius: 6px }
.quick-add:hover { background: var(--surface); color: var(--fg) }

.card { background: var(--surface); border-radius: 6px; padding: 10px 12px; box-shadow: var(--shadow); border: 1px solid transparent; cursor: grab; display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100% }
.card:hover { border-color: var(--line) }
.card.dragging { opacity: .45 }
.card-title { font-weight: 500; overflow-wrap: anywhere }
.card.done .card-title { color: var(--muted); text-decoration: line-through }
.meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted) }
.meta .right { margin-left: auto; display: flex; align-items: center; gap: 6px }
.key { font-family: var(--f-mono); font-size: 12px; color: var(--muted) }
.type { width: 16px; height: 16px; border-radius: 3px; display: inline-grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700; flex: none }
.type.task { background: var(--task) } .type.bug { background: var(--bug) } .type.story { background: var(--story) }
.prio { font-weight: 700; font-size: 12px; letter-spacing: -1px }
.prio.highest, .prio.high { color: var(--p-high) } .prio.medium { color: var(--p-med) } .prio.low { color: var(--p-low) }
.pts-chip { background: var(--col); border-radius: 10px; padding: 0 7px; font-variant-numeric: tabular-nums; color: var(--fg) }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; flex: none }
.avatar.none { background: var(--col); color: var(--muted); border: 1px dashed var(--line) }
.due { font-variant-numeric: tabular-nums }
.due.late { color: var(--bug); font-weight: 600 }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px }
table { border-collapse: collapse; width: 100%; min-width: 720px }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle }
th { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; background: var(--bg) }
tbody tr { cursor: pointer } tbody tr:hover { background: var(--bg) }
td.num { font-variant-numeric: tabular-nums }
.pill { display: inline-block; border-radius: 4px; padding: 1px 8px; font-size: 12px; font-weight: 600; white-space: nowrap }
.pill.todo { background: var(--col); color: var(--muted) }
.pill.doing { background: var(--accent-soft); color: var(--accent) }
.pill.review { background: color-mix(in srgb, var(--p-med) 18%, transparent); color: var(--p-med) }
.pill.done { background: color-mix(in srgb, var(--story) 18%, transparent); color: var(--story) }

/* calendar */
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px }
.cal-head h2 { margin: 0; font-size: 18px; min-width: 11ch; text-align: center }
.cal-head .muted { color: var(--muted); font-size: 13px; margin-left: auto }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 32px; height: 32px; font-size: 18px; line-height: 1 }
.icon-btn:hover { background: var(--col) }
.cal-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(92px, 1fr)); min-width: 660px }
.dow { padding: 6px 8px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--line) }
.day { min-height: 112px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px; display: flex; flex-direction: column; gap: 3px; min-width: 0; transition: background .15s }
.day:nth-child(7n) { border-right: 0 }
.day.out { background: var(--bg) }
.day.out .dnum { color: var(--muted); font-weight: 400 }
.day.over, .nodue-list.over { background: var(--accent-soft) }
.day-head { display: flex; align-items: center; justify-content: space-between }
.dnum { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 22px; height: 22px; display: grid; place-items: center; border-radius: 11px }
.day.today .dnum { background: var(--accent); color: var(--accent-fg) }
.day-add { opacity: 0; border: 0; background: transparent; color: var(--muted); font-size: 16px; line-height: 1; padding: 0 6px; border-radius: 4px }
.day-add:hover { background: var(--col); color: var(--fg) }
.day:hover .day-add, .day-add:focus-visible { opacity: 1 }
@media (hover: none) { .day-add { opacity: 1 } }
.chip { display: flex; align-items: center; gap: 5px; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 2px 6px; font-size: 12px; text-align: left; cursor: grab; min-width: 0 }
.chip:hover { border-color: var(--muted) }
.chip.dragging { opacity: .45 }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.chip .key { flex: none; font-size: 11px }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none }
.dot.task { background: var(--task) } .dot.bug { background: var(--bug) } .dot.story { background: var(--story) }
.chip.done .t { text-decoration: line-through; color: var(--muted) }
.chip.late { border-color: var(--bug); color: var(--bug) }
.nodue { margin-top: 16px }
.nodue h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.nodue-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px dashed var(--line); border-radius: 8px; min-height: 44px; transition: background .15s }
.nodue-list .chip { width: auto; max-width: 280px }
.nodue-list .hint { color: var(--muted); font-size: 13px; align-self: center }

.empty-board { text-align: center; padding: 48px 16px; color: var(--muted) }
.empty-board h2 { color: var(--fg); font-size: 18px; margin: 0 0 4px }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(10,15,20,.45); z-index: 20 }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 21; display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,.2);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px) }
.drawer-head { display: flex; align-items: center; gap: 8px; padding: 14px 20px; border-bottom: 1px solid var(--line) }
.drawer-head .x { margin-left: auto; border: 0; background: transparent; font-size: 20px; line-height: 1; padding: 4px 8px; border-radius: 6px }
.drawer-head .x:hover { background: var(--col) }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px }
.f-title { font-size: 20px; font-weight: 600; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; margin: 0 -8px; background: transparent; width: calc(100% + 16px) }
.f-title:hover, .f-title:focus { border-color: var(--line); background: var(--bg) }
label.lbl { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; display: block; margin-bottom: 4px }
textarea, .grid input, .grid select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 7px 10px }
textarea { min-height: 120px; resize: vertical }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr } }
.drawer-foot { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); align-items: center; flex-wrap: wrap }
.drawer-foot .stamp { font-size: 12px; color: var(--muted); margin-right: auto }
.confirm { display: flex; gap: 8px; align-items: center; font-size: 13px }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 6px; z-index: 30; font-size: 13px }
.col-tabs, .agenda, .card .move { display: none }

/* phones */
@media (max-width: 640px) {
  input, select, textarea { font-size: 16px }   /* stops iOS zooming into fields */
  header { position: static }
  .head-row { padding-block: 10px; gap: 8px; flex-wrap: nowrap }
  .title-block { flex: 1 1 auto }
  #syncNote { display: none }
  h1 { font-size: 18px }
  #createBtn { padding: 8px 14px }
  .tools { gap: 6px }
  .tools .search { flex: 1 1 100%; max-width: none; padding: 8px 10px }
  .tools select { flex: 1 1 0; min-width: 0; padding: 8px }
  .seg { margin-left: 0; flex: 1 1 100% }
  .seg button { flex: 1; padding: 8px 6px }
  main { padding-block: 12px 24px }

  /* board: one column at a time, picked with tabs; cards move with buttons instead of drag */
  .col-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 10px }
  .col-tabs button { display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 4px; font-size: 13px; font-weight: 600; line-height: 1.3; white-space: nowrap }
  .col-tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
  .col-tabs .count { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums }
  .board { grid-template-columns: 1fr; overflow: visible }
  .board .column:not(.active) { display: none }
  .board .col-head { display: none }
  .column { min-height: 0; padding: 8px }
  .card { cursor: pointer; padding: 12px }
  .card .move { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px }
  .card .move button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 10px; font-size: 13px; font-weight: 500 }
  .quick-add { padding: 10px 8px }

  /* list: rows become cards */
  .table-wrap { background: none; border: 0; overflow: visible }
  .table-wrap table { min-width: 0 }
  .table-wrap thead { display: none }
  .table-wrap tbody { display: flex; flex-direction: column; gap: 8px }
  .table-wrap tr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px }
  .table-wrap td { display: block; border: 0; padding: 0; font-size: 13px }
  .table-wrap td:nth-child(1) { order: 1 }
  .table-wrap td:nth-child(3) { order: 2; margin-left: auto }
  .table-wrap td:nth-child(2) { order: 3; flex-basis: 100%; font-size: 15px; font-weight: 600 }
  .table-wrap td:nth-child(n+4) { order: 4; color: var(--muted) }
  .table-wrap td[data-label]::before { content: attr(data-label) " "; color: var(--muted) }

  /* calendar: dots in the month grid, tap a day to list its tasks */
  .cal-head h2 { min-width: 0; flex: 1; font-size: 16px }
  .cal-head .muted { flex-basis: 100%; margin-left: 0 }
  .cal-grid { min-width: 0; grid-template-columns: repeat(7, minmax(0, 1fr)) }
  .dow { text-align: center; padding: 6px 0 }
  .day { min-height: 52px; padding: 4px 2px; cursor: pointer; display: grid; grid-template-columns: repeat(3, 7px); justify-content: center; align-content: start; gap: 3px }
  .day-head { grid-column: 1 / -1; justify-content: center }
  .day-add { display: none }
  .day .chip { width: 7px; height: 7px; padding: 0; border: 0; background: none; pointer-events: none }
  .day .chip .key, .day .chip .t { display: none }
  .day .chip .dot { width: 7px; height: 7px; border-radius: 50% }
  .day.sel { background: var(--accent-soft) }
  .day.sel .dnum { outline: 2px solid var(--accent) }
  .agenda { display: block; margin-top: 12px }
  .agenda-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px }
  .agenda-head h3 { margin: 0; flex: 1; font-size: 15px }
  .agenda-list { display: flex; flex-direction: column; gap: 6px }
  .agenda-list .chip, .nodue-list .chip { width: 100%; max-width: none; padding: 10px 12px; font-size: 14px }
  .agenda-list .hint { color: var(--muted); font-size: 13px }

  /* task drawer fills the screen */
  .drawer-head, .drawer-foot { padding-left: 16px; padding-right: 16px }
  .drawer-body { padding: 16px }
  .drawer-foot .btn { padding: 10px 14px }
  .drawer-foot .stamp { flex-basis: 100%; margin-right: 0 }
  .drawer-foot > .btn, #delWrap { flex: 1 1 0 }
  #delWrap .btn { width: 100% }
  #delWrap .confirm { flex-wrap: wrap }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
</head>
<body>

<header>
  <nav class="wrap appnav" aria-label="เครื่องมือ">
    <a href="taskboard.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="7" rx="1.5"/></svg><span>บอร์ดงาน</span></a>
    <a href="spec.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7l2 2 3.5-3.5M3.5 16l2 2 3.5-3.5M13 8h8M13 17h8"/></svg><span>Spec<span class="lbl-long"> Payment Gateway</span></span></a>
    <a href="notes.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h5"/></svg><span>Note</span></a>
  </nav>
  <div class="wrap head-row">
    <div class="title-block">
      <div class="crumb">โปรเจกต์ / TSK</div>
      <h1>บอร์ดงานทีม</h1>
    </div>
    <span class="status-note" id="syncNote"></span>
    <button class="btn primary" id="createBtn" type="button">+ สร้างงาน</button>
  </div>
  <div class="wrap tools">
    <input class="search" id="q" type="search" placeholder="ค้นหาชื่องาน หรือรหัส เช่น TSK-3" aria-label="ค้นหางาน">
    <select id="fAssignee" aria-label="กรองตามผู้รับผิดชอบ"><option value="">ทุกคน</option></select>
    <select id="fType" aria-label="กรองตามประเภท">
      <option value="">ทุกประเภท</option><option value="task">Task</option><option value="bug">Bug</option><option value="story">Story</option>
    </select>
    <div class="seg" role="group" aria-label="มุมมอง">
      <button type="button" id="vBoard" aria-pressed="true">บอร์ด</button>
      <button type="button" id="vList" aria-pressed="false">รายการ</button>
      <button type="button" id="vCal" aria-pressed="false">ปฏิทิน</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="col-tabs" id="colTabs" role="tablist" aria-label="สถานะงาน"></div>
  <div id="board" class="board"></div>
  <div id="list" class="table-wrap" hidden></div>
  <div id="cal" hidden></div>
  <div id="emptyAll" class="empty-board" hidden>
    <h2>ยังไม่มีงานบนบอร์ด</h2>
    <p>กด “+ สร้างงาน” เพื่อเพิ่มงานแรก แล้วลากการ์ดข้ามคอลัมน์เพื่ออัปเดตสถานะ</p>
  </div>
</main>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dTitle">
  <div class="drawer-head">
    <span id="dType" class="type task">✓</span>
    <span id="dKey" class="key"></span>
    <button class="x" type="button" id="dClose" aria-label="ปิด">×</button>
  </div>
  <form id="dForm" class="drawer-body">
    <input id="dTitle" class="f-title" required placeholder="สรุปงานสั้น ๆ" aria-label="ชื่องาน">
    <div class="grid">
      <div><label class="lbl" for="dStatus">สถานะ</label><select id="dStatus"></select></div>
      <div><label class="lbl" for="dTypeSel">ประเภท</label>
        <select id="dTypeSel"><option value="task">Task</option><option value="bug">Bug</option><option value="story">Story</option></select></div>
      <div><label class="lbl" for="dPrio">ความสำคัญ</label>
        <select id="dPrio"><option value="highest">สูงสุด</option><option value="high">สูง</option><option value="medium">ปานกลาง</option><option value="low">ต่ำ</option></select></div>
      <div><label class="lbl" for="dAssignee">ผู้รับผิดชอบ</label><input id="dAssignee" list="people" placeholder="ยังไม่มอบหมาย"><datalist id="people"></datalist></div>
      <div><label class="lbl" for="dPoints">Story points</label><input id="dPoints" type="number" min="0" max="100" step="1" inputmode="numeric"></div>
      <div><label class="lbl" for="dDue">กำหนดส่ง</label><input id="dDue" type="date"></div>
    </div>
    <div><label class="lbl" for="dDesc">รายละเอียด</label><textarea id="dDesc" placeholder="อธิบายงาน เงื่อนไขที่ถือว่าเสร็จ ลิงก์ที่เกี่ยวข้อง"></textarea></div>
  </form>
  <div class="drawer-foot">
    <span class="stamp" id="dStamp"></span>
    <span id="delWrap"><button class="btn danger" type="button" id="dDelete">ลบงาน</button></span>
    <button class="btn" type="button" id="dCancel">ยกเลิก</button>
    <button class="btn primary" type="submit" form="dForm" id="dSave">บันทึก</button>
  </div>
</aside>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
const STATUSES = [
  { id: "todo", name: "ต้องทำ" },
  { id: "doing", name: "กำลังทำ" },
  { id: "review", name: "รอตรวจ" },
  { id: "done", name: "เสร็จแล้ว" },
];
const TYPE_ICON = { task: "✓", bug: "!", story: "S" };
const PRIO = { highest: { s: "⇈", n: "สูงสุด", r: 0 }, high: { s: "↑", n: "สูง", r: 1 }, medium: { s: "=", n: "ปานกลาง", r: 2 }, low: { s: "↓", n: "ต่ำ", r: 3 } };
const AV_COLORS = ["#1f5fbf", "#2f8f4e", "#a14bb8", "#c4622d", "#0f7f86", "#b8355a", "#5a6acf"];

const $ = id => document.getElementById(id);
let tasks = [];          // [{id, key, title, desc, status, type, priority, assignee, points, due, order, created, updated}]
let view = "board";
let editing = null;      // task id or "new"
let readOnly = false;
let mobileCol = "todo";   // the one column shown on phones
try { const v = localStorage.getItem("taskboard.view"); if (v === "list" || v === "cal") view = v } catch {}
try { const c = localStorage.getItem("taskboard.col"); if (["todo", "doing", "review", "done"].includes(c)) mobileCol = c } catch {}
const isPhone = () => matchMedia("(max-width: 640px)").matches;

/* ---------- storage: Supabase table public.tasks ---------- */
const COLS = "id,key,title,description,status,type,priority,assignee,points,due_date,sort_order,created_at,updated_at";
const fromRow = r => ({ id: r.id, key: r.key, title: r.title, desc: r.description, status: r.status, type: r.type, priority: r.priority,
  assignee: r.assignee || "", points: r.points, due: r.due_date || "", order: r.sort_order, created: Date.parse(r.created_at), updated: Date.parse(r.updated_at) });
const toRow = d => ({ title: d.title, description: d.desc || "", status: d.status, type: d.type, priority: d.priority,
  assignee: d.assignee || null, points: d.points || 0, due_date: d.due || null, sort_order: d.order ?? 0 });

async function loadTasks() {
  const { data, error } = await sb.from("tasks").select(COLS).order("key");
  if (error) throw error;
  tasks = data.map(fromRow);
  render();
}
// id = null creates a new task (the database assigns id and TSK key); resolves with the saved task or null
async function saveTask(id, data) {
  const q = id ? sb.from("tasks").update(toRow(data)).eq("id", id) : sb.from("tasks").insert(toRow(data));
  const { data: row, error } = await q.select(COLS).single();
  if (error) { handleWriteError(error); return null }
  const t = fromRow(row), i = tasks.findIndex(x => x.id === t.id);
  if (i >= 0) tasks[i] = t; else tasks.push(t);
  render();
  return t;
}
async function removeTask(id) {
  const { error } = await sb.from("tasks").delete().eq("id", id);
  if (error) { handleWriteError(error); return false }
  tasks = tasks.filter(t => t.id !== id);
  render();
  return true;
}
function handleWriteError(e) {
  console.error(e);
  toast(e?.message ? `บันทึกไม่สำเร็จ: ${e.message}` : "บันทึกไม่สำเร็จ ลองอีกครั้ง");
}
function nextKey() { return tasks.reduce((m, t) => Math.max(m, t.key || 0), 0) + 1 }
function nextOrder(status) { return tasks.filter(t => t.status === status).reduce((m, t) => Math.max(m, t.order || 0), 0) + 1 }

/* ---------- helpers ---------- */
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])) }
function initials(name) { const p = name.trim().split(/\s+/); return ((p[0] || "")[0] || "").toUpperCase() + ((p[1] || "")[0] || "").toUpperCase() }
function avColor(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length] }
function avatar(name) {
  if (!name) return `<span class="avatar none" title="ยังไม่มอบหมาย">?</span>`;
  return `<span class="avatar" style="background:${avColor(name)}" title="${esc(name)}">${esc(initials(name))}</span>`;
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayStr = () => ymd(new Date());  // local date, not UTC
function fmtDue(d) { if (!d) return ""; const [y, m, dd] = d.split("-"); return `${+dd}/${+m}` }
function fmtStamp(ms) { if (!ms) return ""; return new Date(ms).toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" }) }

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  const a = $("fAssignee").value, ty = $("fType").value;
  return tasks.filter(t => {
    if (a === "__none" ? t.assignee : a && t.assignee !== a) return false;
    if (ty && t.type !== ty) return false;
    if (q && !(`tsk-${t.key} ${t.title} ${t.desc || ""}`.toLowerCase().includes(q))) return false;
    return true;
  });
}

/* ---------- render ---------- */
function cardHTML(t) {
  const late = t.due && t.status !== "done" && t.due < todayStr();
  const si = STATUSES.findIndex(s => s.id === t.status);
  return `<div class="card${t.status === "done" ? " done" : ""}" draggable="${!readOnly}" data-id="${t.id}" tabindex="0" role="button" aria-label="TSK-${t.key} ${esc(t.title)}">
    <div class="card-title">${esc(t.title)}</div>
    <div class="meta">
      <span class="type ${t.type}" title="${t.type}">${TYPE_ICON[t.type] || "✓"}</span>
      <span class="key">TSK-${t.key}</span>
      ${t.due ? `<span class="due${late ? " late" : ""}" title="กำหนดส่ง">${late ? "เลย " : ""}${fmtDue(t.due)}</span>` : ""}
      <span class="right">
        <span class="prio ${t.priority}" title="ความสำคัญ: ${PRIO[t.priority]?.n || ""}">${PRIO[t.priority]?.s || ""}</span>
        ${t.points ? `<span class="pts-chip" title="Story points">${t.points}</span>` : ""}
        ${avatar(t.assignee)}
      </span>
    </div>
    ${readOnly ? "" : `<div class="move">
      ${si > 0 ? `<button type="button" data-move="-1" aria-label="ย้ายไป ${STATUSES[si - 1].name}">‹ ${STATUSES[si - 1].name}</button>` : "<span></span>"}
      ${si < STATUSES.length - 1 ? `<button type="button" data-move="1" aria-label="ย้ายไป ${STATUSES[si + 1].name}">${STATUSES[si + 1].name} ›</button>` : ""}
    </div>`}
  </div>`;
}

function render() {
  const list = filtered();
  // assignee filter options
  const people = [...new Set(tasks.map(t => t.assignee).filter(Boolean))].sort((a, b) => a.localeCompare(b, "th"));
  const cur = $("fAssignee").value;
  $("fAssignee").innerHTML = `<option value="">ทุกคน</option>` + people.map(p => `<option>${esc(p)}</option>`).join("") + `<option value="__none">ยังไม่มอบหมาย</option>`;
  $("fAssignee").value = people.includes(cur) || cur === "__none" ? cur : "";
  $("people").innerHTML = people.map(p => `<option value="${esc(p)}">`).join("");

  $("emptyAll").hidden = tasks.length > 0 || view !== "board";
  $("board").hidden = $("colTabs").hidden = view !== "board";
  $("list").hidden = view !== "list";
  $("cal").hidden = view !== "cal";
  $("vBoard").setAttribute("aria-pressed", view === "board");
  $("vList").setAttribute("aria-pressed", view === "list");
  $("vCal").setAttribute("aria-pressed", view === "cal");

  if (view === "cal") renderCal(list);
  else if (view === "board") {
    $("colTabs").innerHTML = STATUSES.map(s => `<button type="button" role="tab" data-col="${s.id}" aria-selected="${s.id === mobileCol}">${s.name}<span class="count">${list.filter(t => t.status === s.id).length}</span></button>`).join("");
    $("board").innerHTML = STATUSES.map(s => {
      const items = list.filter(t => t.status === s.id).sort((a, b) => (a.order || 0) - (b.order || 0));
      const pts = items.reduce((n, t) => n + (+t.points || 0), 0);
      return `<section class="column${s.id === mobileCol ? " active" : ""}" data-status="${s.id}" aria-label="${s.name}">
        <div class="col-head">${s.name}<span class="count">${items.length}</span>${pts ? `<span class="pts">${pts} pts</span>` : ""}</div>
        ${items.map(cardHTML).join("") || `<div class="col-empty">ลากการ์ดมาวางที่นี่</div>`}
        ${readOnly ? "" : `<button class="quick-add" type="button" data-add="${s.id}">+ เพิ่มงาน</button>`}
      </section>`;
    }).join("");
  } else {
    const rows = [...list].sort((a, b) => STATUSES.findIndex(s => s.id === a.status) - STATUSES.findIndex(s => s.id === b.status) || (PRIO[a.priority]?.r ?? 9) - (PRIO[b.priority]?.r ?? 9) || a.key - b.key);
    $("list").innerHTML = `<table><thead><tr><th>รหัส</th><th>ชื่องาน</th><th>สถานะ</th><th>ความสำคัญ</th><th>ผู้รับผิดชอบ</th><th>Points</th><th>กำหนดส่ง</th></tr></thead><tbody>
      ${rows.map(t => { const late = t.due && t.status !== "done" && t.due < todayStr();
        return `<tr data-id="${t.id}" tabindex="0">
        <td><span style="display:inline-flex;gap:6px;align-items:center"><span class="type ${t.type}">${TYPE_ICON[t.type]}</span><span class="key">TSK-${t.key}</span></span></td>
        <td>${esc(t.title)}</td>
        <td><span class="pill ${t.status}">${STATUSES.find(s => s.id === t.status)?.name || ""}</span></td>
        <td><span class="prio ${t.priority}">${PRIO[t.priority]?.s || ""}</span> ${PRIO[t.priority]?.n || ""}</td>
        <td><span style="display:inline-flex;gap:6px;align-items:center">${avatar(t.assignee)}${esc(t.assignee || "—")}</span></td>
        <td class="num" data-label="Points">${t.points || "—"}</td>
        <td class="num" data-label="กำหนดส่ง"><span class="due${late ? " late" : ""}">${t.due ? fmtDue(t.due) : "—"}</span></td></tr>` }).join("")
        || `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:24px">${tasks.length ? "ไม่พบงานที่ตรงกับตัวกรอง" : "ยังไม่มีงาน กด “+ สร้างงาน” เพื่อเริ่ม"}</td></tr>`}
      </tbody></table>`;
  }
}

/* ---------- calendar ---------- */
let calMonth = (d => new Date(d.getFullYear(), d.getMonth(), 1))(new Date());
let calSel = null;   // day picked on phones
const DOW = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];
function chipHTML(t) {
  const late = t.due && t.status !== "done" && t.due < todayStr();
  return `<button type="button" class="chip${t.status === "done" ? " done" : ""}${late ? " late" : ""}" draggable="${!readOnly}" data-id="${t.id}" title="TSK-${t.key} ${esc(t.title)}${t.assignee ? " · " + esc(t.assignee) : ""}">
    <span class="dot ${t.type}"></span><span class="key">TSK-${t.key}</span><span class="t">${esc(t.title)}</span></button>`;
}
function renderCal(list) {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1), daysInMonth = new Date(y, m + 1, 0).getDate();
  const cells = Math.ceil((first.getDay() + daysInMonth) / 7) * 7;
  const byDay = {};
  list.forEach(t => { if (t.due) (byDay[t.due] = byDay[t.due] || []).push(t) });
  Object.values(byDay).forEach(a => a.sort((p, q) => (PRIO[p.priority]?.r ?? 9) - (PRIO[q.priority]?.r ?? 9) || p.key - q.key));
  const monthPrefix = `${y}-${String(m + 1).padStart(2, "0")}`;
  const inMonth = list.filter(t => t.due && t.due.startsWith(monthPrefix)).length;
  const today = todayStr();
  const selKey = calSel && calSel.startsWith(monthPrefix) ? calSel : today.startsWith(monthPrefix) ? today : `${monthPrefix}-01`;
  let days = "";
  for (let i = 0; i < cells; i++) {
    const d = new Date(y, m, 1 - first.getDay() + i), key = ymd(d);
    days += `<div class="day${d.getMonth() !== m ? " out" : ""}${key === today ? " today" : ""}${key === selKey ? " sel" : ""}" data-date="${key}">
      <div class="day-head"><span class="dnum">${d.getDate()}</span>${readOnly ? "" : `<button type="button" class="day-add" data-due="${key}" aria-label="เพิ่มงานกำหนดส่ง ${key}">+</button>`}</div>
      ${(byDay[key] || []).map(chipHTML).join("")}
    </div>`;
  }
  const noDue = list.filter(t => !t.due).sort((a, b) => a.key - b.key);
  $("cal").innerHTML = `
    <div class="cal-head">
      <button type="button" class="icon-btn" data-nav="-1" aria-label="เดือนก่อนหน้า">‹</button>
      <h2>${first.toLocaleDateString("th-TH", { month: "long", year: "numeric" })}</h2>
      <button type="button" class="icon-btn" data-nav="1" aria-label="เดือนถัดไป">›</button>
      <button type="button" class="btn" data-nav="0">วันนี้</button>
      <span class="muted">ครบกำหนดเดือนนี้ ${inMonth} งาน</span>
    </div>
    <div class="cal-scroll"><div class="cal-grid">${DOW.map(d => `<div class="dow">${d}</div>`).join("")}${days}</div></div>
    <section class="agenda">
      <div class="agenda-head"><h3>${new Date(selKey + "T00:00").toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long" })}</h3>
        ${readOnly ? "" : `<button type="button" class="btn" data-due="${selKey}">+ เพิ่มงาน</button>`}</div>
      <div class="agenda-list">${(byDay[selKey] || []).map(chipHTML).join("") || `<span class="hint">ไม่มีงานครบกำหนดวันนี้</span>`}</div>
    </section>
    <section class="nodue">
      <h3>ยังไม่มีกำหนดส่ง (${noDue.length})</h3>
      <div class="nodue-list" data-date="">${noDue.map(chipHTML).join("") || `<span class="hint">ลากงานมาวางที่นี่เพื่อลบกำหนดส่ง</span>`}</div>
    </section>`;
}
$("cal").addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) {
    const n = +nav.dataset.nav, now = new Date();
    calMonth = n ? new Date(calMonth.getFullYear(), calMonth.getMonth() + n, 1) : new Date(now.getFullYear(), now.getMonth(), 1);
    return render();
  }
  const add = e.target.closest("[data-due]"); if (add) return openDrawer("new", "todo", add.dataset.due);
  const day = isPhone() && e.target.closest(".day");
  if (day) { calSel = day.dataset.date; return render() }
  const chip = e.target.closest(".chip"); if (chip) openDrawer(chip.dataset.id);
});
let calDragId = null;
$("cal").addEventListener("dragstart", e => {
  const c = e.target.closest(".chip"); if (!c || readOnly) return;
  calDragId = c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", calDragId) } catch {}
});
$("cal").addEventListener("dragend", () => { calDragId = null; document.querySelectorAll("#cal .over, #cal .dragging").forEach(el => el.classList.remove("over", "dragging")) });
$("cal").addEventListener("dragover", e => {
  const zone = e.target.closest("[data-date]"); if (!zone || !calDragId) return;
  e.preventDefault();
  document.querySelectorAll("#cal .over").forEach(el => el !== zone && el.classList.remove("over"));
  zone.classList.add("over");
});
$("cal").addEventListener("drop", async e => {
  const zone = e.target.closest("[data-date]"); if (!zone || !calDragId) return;
  e.preventDefault();
  const t = tasks.find(x => x.id === calDragId); calDragId = null;
  if (!t || (t.due || "") === zone.dataset.date) return render();
  const { id, ...data } = t;
  if (await saveTask(id, { ...data, due: zone.dataset.date, updated: Date.now() }))
    toast(zone.dataset.date ? `TSK-${t.key} กำหนดส่ง ${fmtDue(zone.dataset.date)}` : `ลบกำหนดส่งของ TSK-${t.key} แล้ว`);
});

/* ---------- drag & drop ---------- */
let dragId = null;
$("board").addEventListener("dragstart", e => {
  const c = e.target.closest(".card"); if (!c || readOnly) return;
  dragId = c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", dragId) } catch {}
});
$("board").addEventListener("dragend", e => { e.target.closest?.(".card")?.classList.remove("dragging"); document.querySelectorAll(".column.over").forEach(c => c.classList.remove("over")) });
$("board").addEventListener("dragover", e => {
  const col = e.target.closest(".column"); if (!col || !dragId) return;
  e.preventDefault();
  document.querySelectorAll(".column.over").forEach(c => c !== col && c.classList.remove("over"));
  col.classList.add("over");
});
$("board").addEventListener("drop", async e => {
  const col = e.target.closest(".column"); if (!col || !dragId) return;
  e.preventDefault(); col.classList.remove("over");
  const t = tasks.find(x => x.id === dragId); const id = dragId; dragId = null;
  if (!t) return;
  const status = col.dataset.status;
  // order: drop before the card under the pointer, else at the end
  const others = tasks.filter(x => x.status === status && x.id !== id).sort((a, b) => (a.order || 0) - (b.order || 0));
  const below = [...col.querySelectorAll(".card")].find(c => c.dataset.id !== id && e.clientY < c.getBoundingClientRect().top + c.offsetHeight / 2);
  let order;
  if (below) {
    const i = others.findIndex(x => x.id === below.dataset.id);
    const prev = others[i - 1]?.order ?? (others[i].order - 1);
    order = (prev + others[i].order) / 2;
  } else order = (others.at(-1)?.order || 0) + 1;
  if (t.status === status && t.order === order) return;
  const { id: _, ...data } = t;
  await saveTask(id, { ...data, status, order, updated: Date.now() });
});

/* ---------- drawer ---------- */
$("dStatus").innerHTML = STATUSES.map(s => `<option value="${s.id}">${s.name}</option>`).join("");
function openDrawer(id, status, due) {
  editing = id;
  const t = id === "new" ? { title: "", status: status || "todo", type: "task", priority: "medium", assignee: "", points: "", due: due || "", desc: "" } : tasks.find(x => x.id === id);
  if (!t) return;
  $("dKey").textContent = id === "new" ? "งานใหม่" : `TSK-${t.key}`;
  $("dType").className = `type ${t.type}`; $("dType").textContent = TYPE_ICON[t.type];
  $("dTitle").value = t.title; $("dStatus").value = t.status; $("dTypeSel").value = t.type;
  $("dPrio").value = t.priority; $("dAssignee").value = t.assignee || ""; $("dPoints").value = t.points || "";
  $("dDue").value = t.due || ""; $("dDesc").value = t.desc || "";
  $("dStamp").textContent = id === "new" ? "" : `อัปเดต ${fmtStamp(t.updated)}`;
  resetDelete(); $("delWrap").hidden = id === "new";
  $("scrim").hidden = false; $("drawer").hidden = false;
  setTimeout(() => $("dTitle").focus(), 0);
}
function closeDrawer() { $("scrim").hidden = true; $("drawer").hidden = true; editing = null }
function resetDelete() { $("delWrap").innerHTML = `<button class="btn danger" type="button" id="dDelete">ลบงาน</button>` }
$("dTypeSel").addEventListener("change", () => { const v = $("dTypeSel").value; $("dType").className = `type ${v}`; $("dType").textContent = TYPE_ICON[v] });
$("dForm").addEventListener("submit", async e => {
  e.preventDefault(); if (readOnly) return;
  const title = $("dTitle").value.trim(); if (!title) { $("dTitle").focus(); return }
  const status = $("dStatus").value;
  const base = editing === "new" ? { key: nextKey(), order: nextOrder(status), created: Date.now() } : (({ id, ...d }) => d)(tasks.find(x => x.id === editing));
  if (editing !== "new" && base.status !== status) base.order = nextOrder(status);
  const data = { ...base, title, status, type: $("dTypeSel").value, priority: $("dPrio").value, assignee: $("dAssignee").value.trim(),
    points: $("dPoints").value ? Math.max(0, Math.round(+$("dPoints").value)) : 0, due: $("dDue").value, desc: $("dDesc").value, updated: Date.now() };
  const isNew = editing === "new";
  const saved = await saveTask(isNew ? null : editing, data);
  if (saved) { closeDrawer(); toast(isNew ? `สร้าง TSK-${saved.key} แล้ว` : `บันทึก TSK-${saved.key} แล้ว`) }
});
$("delWrap").addEventListener("click", async e => {
  if (e.target.id === "dDelete") {
    $("delWrap").innerHTML = `<span class="confirm">ลบถาวร? <button class="btn danger" type="button" id="dDelYes">ลบ</button><button class="btn" type="button" id="dDelNo">ไม่ลบ</button></span>`;
  } else if (e.target.id === "dDelNo") resetDelete();
  else if (e.target.id === "dDelYes") {
    const t = tasks.find(x => x.id === editing);
    if (t && await removeTask(t.id)) { closeDrawer(); toast(`ลบ TSK-${t.key} แล้ว`) }
  }
});
$("dClose").onclick = $("dCancel").onclick = $("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape" && editing) closeDrawer() });

/* ---------- events ---------- */
$("createBtn").onclick = () => openDrawer("new");
$("board").addEventListener("click", async e => {
  const mv = e.target.closest("[data-move]");
  if (mv) {
    const t = tasks.find(x => x.id === mv.closest(".card").dataset.id); if (!t) return;
    const to = STATUSES[STATUSES.findIndex(s => s.id === t.status) + +mv.dataset.move];
    const { id, ...data } = t;
    if (await saveTask(id, { ...data, status: to.id, order: nextOrder(to.id) })) toast(`TSK-${t.key} → ${to.name}`);
    return;
  }
  const add = e.target.closest("[data-add]"); if (add) return openDrawer("new", add.dataset.add);
  const c = e.target.closest(".card"); if (c) openDrawer(c.dataset.id);
});
$("board").addEventListener("keydown", e => { const c = e.target.closest(".card"); if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openDrawer(c.dataset.id) } });
$("list").addEventListener("click", e => { const r = e.target.closest("tr[data-id]"); if (r) openDrawer(r.dataset.id) });
$("list").addEventListener("keydown", e => { const r = e.target.closest("tr[data-id]"); if (r && e.key === "Enter") openDrawer(r.dataset.id) });
["q", "fAssignee", "fType"].forEach(id => $(id).addEventListener("input", render));
function setView(v) { view = v; try { localStorage.setItem("taskboard.view", v) } catch {} render() }
$("vBoard").onclick = () => setView("board");
$("vList").onclick = () => setView("list");
$("vCal").onclick = () => setView("cal");
$("colTabs").addEventListener("click", e => {
  const b = e.target.closest("[data-col]"); if (!b) return;
  mobileCol = b.dataset.col;
  try { localStorage.setItem("taskboard.col", mobileCol) } catch {}
  render();
});

let toastT;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2400) }
function applyReadOnly() {
  $("createBtn").hidden = readOnly; $("dSave").hidden = readOnly; $("delWrap").hidden = readOnly;
  if (readOnly) $("syncNote").textContent = "ดูอย่างเดียว";
  render();
}

/* ---------- boot ---------- */
$("syncNote").textContent = "กำลังเชื่อมต่อ…";
render();
requireUser().then(async () => {
  try {
    await loadTasks();
    $("syncNote").textContent = "ซิงก์กับทีมแล้ว";
  } catch (e) {
    $("syncNote").textContent = "โหลดงานไม่สำเร็จ รีเฟรชเพื่อลองใหม่";
    return handleWriteError(e);
  }
  // live updates when a teammate changes a task
  let t;
  const reload = () => { clearTimeout(t); t = setTimeout(() => loadTasks().catch(() => {}), 300) };
  sb.channel("tasks-board").on("postgres_changes", { event: "*", schema: "public", table: "tasks" }, reload).subscribe();
  window.addEventListener("focus", reload);
});
</script>
</body>
</html>
